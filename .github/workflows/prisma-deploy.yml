name: prisma-deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: prisma-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      # Fix the malformed pnpm-workspace.yaml and regenerate lockfile
      - name: Fix pnpm workspace & regenerate lockfile
        run: |
          # pnpm-workspace.yaml is malformed (missing packages field) - remove it for single-package project
          rm -f pnpm-workspace.yaml
          # Remove stale lockfile that has conflicting @effect/sql-d1 versions
          rm -f pnpm-lock.yaml
          # Regenerate clean lockfile with overrides applied
          pnpm install
      - uses: prisma/cloud-deploy-action@v1
        with:
          # Dependencies already installed, just need to build
          install-command: echo "already installed"
          module: module.mjs
          build-command: pnpm run build
